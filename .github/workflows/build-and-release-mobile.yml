name: Build Mobile Apps (APK & IPA) & Publish Releases

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (contoh: v0.1.0). Kosongkan untuk auto-detect dari package.json'
        required: false
        type: string
        default: ''
      release_title:
        description: 'Judul Rilis (opsional, contoh: Kept v0.1.0 — UI Modern & Watchtower Engine)'
        required: false
        type: string
        default: ''
      custom_notes:
        description: 'Catatan rilis manual / keterangan perbaikan bug tambahan (opsional)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ========================================================
  # Job 1: Build Android APK
  # ========================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run verification & health check
        run: npm test

      - name: Build Web App & Sync Android
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://bhldonheosindyolgeom.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_qCuupKOCNn2hL10SEEu58A_CpvnwnCw' }}
        run: |
          npm run build
          npx cap sync android

      - name: Compile Android APK (assembleDebug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk app-latest.apk
          echo "APK generated successfully: $(ls -lh app-latest.apk)"

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-latest-android-apk
          path: app-latest.apk
          retention-days: 14

      - name: Mobile Artifact Ready Notice
        run: |
          echo "Android APK compiled successfully. The APK artifact is ready for download in GitHub Actions Artifacts."

  # ========================================================
  # Job 2: Build iOS IPA
  # ========================================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run verification & health check
        run: npm test

      - name: Build Web App & Sync iOS
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://bhldonheosindyolgeom.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_qCuupKOCNn2hL10SEEu58A_CpvnwnCw' }}
        run: |
          npm run build
          npx cap sync ios

      - name: Compile and Archive iOS App (Unsigned)
        run: |
          mkdir -p build
          # Clear Swift PM cache to prevent SPM "already exists in file system fatalError"
          rm -rf ~/Library/Caches/org.swift.swiftpm/
          rm -rf ~/Library/org.swift.swiftpm/
          rm -rf ~/Library/Developer/Xcode/DerivedData/

          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET_FLAG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_FLAG="-project ios/App/App.xcodeproj"
          fi

          echo "Resolving Swift packages cleanly..."
          xcodebuild -resolvePackageDependencies $TARGET_FLAG -scheme App || true

          echo "Running xcodebuild archive with $TARGET_FLAG..."
          xcodebuild archive \
            $TARGET_FLAG \
            -scheme App \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Extract Payload and Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/App.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: Could not find .app in archive Products!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -y app-latest.ipa Payload
          echo "IPA packaged successfully: $(ls -lh app-latest.ipa)"

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-latest-ios-ipa
          path: app-latest.ipa
          retention-days: 14

      - name: Mobile Artifact Ready Notice
        run: |
          echo "iOS IPA archive created successfully. The IPA artifact is ready for download in GitHub Actions Artifacts."

  # ========================================================
  # Job 3: Publish to GitHub Releases (APK & IPA + Notes)
  # ========================================================
  publish-release:
    name: Publish to GitHub Releases
    needs: [build-android, build-ios]
    if: always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine Version Tag
        id: release_meta
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            TAG="v${PKG_VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Target Release Tag: ${TAG}"

      - name: Download Android APK Artifact
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: app-latest-android-apk
          path: release-binaries

      - name: Download iOS IPA Artifact
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: app-latest-ios-ipa
          path: release-binaries

      - name: Format Release Binaries
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"
          mkdir -p final-assets
          if [ -f "release-binaries/app-latest.apk" ]; then
            cp release-binaries/app-latest.apk "final-assets/Kept-${TAG}-android.apk"
            echo "Prepared Kept-${TAG}-android.apk"
          fi
          if [ -f "release-binaries/app-latest.ipa" ]; then
            cp release-binaries/app-latest.ipa "final-assets/Kept-${TAG}-ios-unsigned.ipa"
            echo "Prepared Kept-${TAG}-ios-unsigned.ipa"
          fi
          ls -lh final-assets

      - name: Publish GitHub Release with APK & IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ inputs.release_title || format('Kept {0}', steps.release_meta.outputs.tag) }}
          body: |
            ${{ inputs.custom_notes }}
            
            ### 📱 Berkas Unduhan Aplikasi (Release Assets)
            - **Android APK**: `Kept-${{ steps.release_meta.outputs.tag }}-android.apk` — *Dapat langsung diunduh dan dipasang pada smartphone Android.*
            - **iOS IPA**: `Kept-${{ steps.release_meta.outputs.tag }}-ios-unsigned.ipa` — *Dapat dipasang di iPhone/iPad melalui sideloading (AltStore, Sideloadly, atau Apple Configurator).*
            
            ---
            *Rilis ini dikompilasi dan dipublikasikan secara otomatis melalui GitHub Actions CI/CD Pipeline.*
          generate_release_notes: true
          files: |
            final-assets/Kept-*-android.apk
            final-assets/Kept-*-ios-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
