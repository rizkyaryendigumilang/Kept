name: Build Mobile Apps (APK & IPA) and Sync to VPS

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # Job 1: Build Android APK
  # ========================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App & Sync Android
        run: |
          npm run build
          npx cap sync android

      - name: Compile Android APK (assembleDebug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk app-latest.apk
          echo "APK generated successfully: $(ls -lh app-latest.apk)"

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-latest-android-apk
          path: app-latest.apk
          retention-days: 14

      - name: Deploy APK to VPS via SCP
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_TARGET_DIR: ${{ secrets.VPS_TARGET_DIR }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "ℹ️ VPS secrets (VPS_HOST / VPS_SSH_KEY) are not configured."
            echo "Skipping SCP transfer. Download APK directly from GitHub Actions Artifacts!"
            exit 0
          fi

          echo "🚀 Deploying app-latest.apk to VPS ($VPS_HOST)..."
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          PORT="${VPS_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          TARGET_DIR="${VPS_TARGET_DIR:-/var/www/downloads}"
          ssh -p "$PORT" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$VPS_USERNAME@$VPS_HOST" "mkdir -p $TARGET_DIR"
          scp -P "$PORT" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no app-latest.apk "$VPS_USERNAME@$VPS_HOST:$TARGET_DIR/app-latest.apk"

          echo "✅ Android APK successfully deployed to $TARGET_DIR/app-latest.apk on $VPS_HOST!"

  # ========================================================
  # Job 2: Build iOS IPA
  # ========================================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App & Sync iOS
        run: |
          npm run build
          npx cap sync ios

      - name: Compile and Archive iOS App (Unsigned)
        run: |
          mkdir -p build
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET_FLAG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_FLAG="-project ios/App/App.xcodeproj"
          fi

          echo "Running xcodebuild archive with $TARGET_FLAG..."
          xcodebuild archive \
            $TARGET_FLAG \
            -scheme App \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Extract Payload and Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/App.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: Could not find .app in archive Products!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -y app-latest.ipa Payload
          echo "IPA packaged successfully: $(ls -lh app-latest.ipa)"

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-latest-ios-ipa
          path: app-latest.ipa
          retention-days: 14

      - name: Deploy IPA to VPS via SCP
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_TARGET_DIR: ${{ secrets.VPS_TARGET_DIR }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "ℹ️ VPS secrets (VPS_HOST / VPS_SSH_KEY) are not configured."
            echo "Skipping SCP transfer. Download IPA directly from GitHub Actions Artifacts!"
            exit 0
          fi

          echo "🚀 Deploying app-latest.ipa to VPS ($VPS_HOST)..."
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          PORT="${VPS_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          TARGET_DIR="${VPS_TARGET_DIR:-/var/www/downloads}"
          ssh -p "$PORT" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$VPS_USERNAME@$VPS_HOST" "mkdir -p $TARGET_DIR"
          scp -P "$PORT" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no app-latest.ipa "$VPS_USERNAME@$VPS_HOST:$TARGET_DIR/app-latest.ipa"

          echo "✅ iOS IPA successfully deployed to $TARGET_DIR/app-latest.ipa on $VPS_HOST!"
