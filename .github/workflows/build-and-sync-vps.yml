name: Build Mobile Apps (APK & IPA)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # Job 1: Build Android APK
  # ========================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run verification & health check
        run: npm test

      - name: Build Web App & Sync Android
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://bhldonheosindyolgeom.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_qCuupKOCNn2hL10SEEu58A_CpvnwnCw' }}
        run: |
          npm run build
          npx cap sync android

      - name: Compile Android APK (assembleDebug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk app-latest.apk
          echo "APK generated successfully: $(ls -lh app-latest.apk)"

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-latest-android-apk
          path: app-latest.apk
          retention-days: 14

      - name: Mobile Artifact Ready Notice
        run: |
          echo "Android APK compiled successfully. The APK artifact is ready for download in GitHub Actions Artifacts."

  # ========================================================
  # Job 2: Build iOS IPA
  # ========================================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run verification & health check
        run: npm test

      - name: Build Web App & Sync iOS
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://bhldonheosindyolgeom.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_qCuupKOCNn2hL10SEEu58A_CpvnwnCw' }}
        run: |
          npm run build
          npx cap sync ios

      - name: Compile and Archive iOS App (Unsigned)
        run: |
          mkdir -p build
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET_FLAG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_FLAG="-project ios/App/App.xcodeproj"
          fi

          echo "Running xcodebuild archive with $TARGET_FLAG..."
          xcodebuild archive \
            $TARGET_FLAG \
            -scheme App \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Extract Payload and Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/App.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: Could not find .app in archive Products!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -y app-latest.ipa Payload
          echo "IPA packaged successfully: $(ls -lh app-latest.ipa)"

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-latest-ios-ipa
          path: app-latest.ipa
          retention-days: 14

      - name: Mobile Artifact Ready Notice
        run: |
          echo "iOS IPA archive created successfully. The IPA artifact is ready for download in GitHub Actions Artifacts."
