# Nconfig nginx untuk Personal Vault (Vite SPA statis)
# Letakkan di: /etc/nginx/sites-available/vault.conf
# Lalu: sudo ln -s /etc/nginx/sites-available/vault.conf /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name vault.example.com;  # ganti dengan domain kamu

    root /var/www/personal-vault/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aset statis di-cache agresif (Vite menghasilkan nama file dengan hash)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker & manifest tidak di-cache lama
    location /sw.js {
        expires 0;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
    location /manifest.webmanifest {
        expires 0;
        add_header Cache-Control "public, max-age=0";
    }

    # Keamanan dasar
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # (Opsional) HTTPS via Certbot / Let's Encrypt nanti:
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/vault.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vault.example.com/privkey.pem;

    # Jika pakai HTTPS, arahkan HTTP ke HTTPS:
    # if ($scheme != "https") {
    #     return 301 https://$host$request_uri;
    # }
}
