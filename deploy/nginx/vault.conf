# =====================================================================
# Nginx untuk Kept (SPA statis hasil Vite)
# =====================================================================
# Alur deploy: local -> GitHub -> VPS (workflow ci-cd-web-vps.yml)
#   * Artefak ditulis ke /srv/www/kept
#   * Vite dibangun dengan --base=/kept/  => app dilayani di /kept/
#   * Aset lama di /srv/www/kept/assets sengaja dipertahankan workflow
#     agar client yang masih memakai versi lama tidak kena chunk 404.
#
# Pasang di: /etc/nginx/sites-available/kept.conf
#   sudo ln -s /etc/nginx/sites-available/kept.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# PENTING sebelum dipakai:
#   1. Ganti vault.example.com dengan domain asli.
#   2. Jalankan Certbot dulu (blok 443 di bawah butuh sertifikat yang ada),
#      atau ubah `listen 443 ssl` -> `listen 80` dan hapus baris ssl_* selama
#      masa uji coba.
#   3. Jika project Supabase berganti, sesuaikan connect-src di CSP.
# =====================================================================

# --- HTTP: hanya untuk redirect ke HTTPS + verifikasi Certbot ---------
server {
    listen 80;
    listen [::]:80;
    server_name vault.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: aplikasi utama --------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vault.example.com;

    ssl_certificate     /etc/letsencrypt/live/vault.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vault.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /srv/www/kept;
    index index.html;

    # ---- Header keamanan ---------------------------------------------
    # HSTS tanpa `preload`: cukup untuk memaksa HTTPS, tanpa mengunci
    # domain selamanya kalau suatu saat pindah host.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), clipboard-write=(self), fullscreen=(self)" always;

    # CSP: hanya izinkan yang benar-benar dipakai aplikasi.
    #   script-src 'self'            -> bundle Vite + registerSW.js (tidak ada inline script)
    #   style-src 'unsafe-inline'    -> React memakai style attribute + CSS Google Fonts
    #   img/media blob: & data:      -> avatar, barcode SVG, pratinjau kamera
    #   frame-src blob:              -> pratinjau PDF di DocumentDetailModal
    #   connect-src                  -> Supabase (REST/Realtime) + HIBP k-anonymity
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https://bhldonheosindyolgeom.supabase.co wss://bhldonheosindyolgeom.supabase.co https://api.pwnedpasswords.com; frame-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # ---- Routing SPA (base /kept/) ------------------------------------
    location = / {
        return 301 /kept/;
    }

    location /kept/ {
        try_files $uri $uri/ /kept/index.html;
    }

    # Aset ber-hash dari Vite: cache 1 tahun.
    # Catatan: `expires` tidak menghapus pewarisan add_header di atas.
    location /kept/assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Service worker & manifest tidak boleh di-cache lama.
    location = /kept/sw.js {
        expires -1;
        try_files $uri =404;
    }

    location = /kept/manifest.webmanifest {
        expires -1;
        try_files $uri =404;
    }

    # Service worker boleh mengendalikan seluruh origin.
    location = /kept/registerSW.js {
        expires -1;
        try_files $uri =404;
    }
}
